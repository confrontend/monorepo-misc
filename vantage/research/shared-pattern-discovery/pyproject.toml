[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-pattern-discovery"
version = "0.1.0"
description = "Isolated, descriptive discovery engine for project-owned normalized exports"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
full = ["scipy>=1.10", "scikit-learn>=1.3", "statsmodels>=0.14"]

[project.scripts]
shared-pattern-discovery = "shared_pattern_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
