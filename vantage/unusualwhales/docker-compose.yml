services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unusualwhales
      POSTGRES_USER: unusualwhales
      POSTGRES_PASSWORD: unusualwhales-local-only
    ports:
      - "54329:5432"
    volumes:
      - unusualwhales-postgres:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unusualwhales -d unusualwhales"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "63791:6379"
    volumes:
      - unusualwhales-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  unusualwhales-postgres:
  unusualwhales-redis:
