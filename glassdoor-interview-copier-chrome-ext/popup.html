<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 320px; 
      padding: 15px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      margin: 0;
    }
    .header { 
      font-weight: bold; 
      font-size: 14px; 
      margin-bottom: 10px; 
      color: #333;
    }
    input { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px;
      margin-bottom: 12px;
    }
    .main-btn { 
      width: 100%; 
      padding: 12px; 
      background: #007cba; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 14px; 
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .main-btn:hover { background: #005a87; }
    .secondary-btn { 
      width: 100%; 
      padding: 10px; 
      background: #f6f7f8; 
      color: #666; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 13px; 
      cursor: pointer;
      margin-bottom: 8px;
    }
    .secondary-btn:hover { background: #e8e9ea; }
    .next-btn { 
      width: 100%; 
      padding: 10px; 
      background: #28a745; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 13px; 
      cursor: pointer;
    }
    .next-btn:hover { background: #218838; }
    #status { 
      font-size: 12px; 
      padding: 8px; 
      border-radius: 4px; 
      margin-top: 8px; 
      text-align: center;
      min-height: 18px;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    #currentPage { 
      font-size: 11px; 
      color: #666; 
      text-align: center; 
      padding: 4px; 
      background: #f8f9fa; 
      border-radius: 4px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">Interview Copier</div>
  
  <label>Filename:</label>
  <input id="filename" placeholder="Company will auto-fill">
  
  <button id="copy" class="main-btn">Copy Current Page</button>
  
  <button id="next" class="next-btn">Next Page</button>
  
  <button id="newfile" class="secondary-btn">New File</button>
  
  <div id="currentPage">Loading page info...</div>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
